name: Update projects

# Regenerates public/data/projects.json from the GitHub API once a week.
# If the data changed it commits the file and redeploys; if not, it does nothing.
# If the API fails the job fails and the previously published JSON stays online.
on:
  schedule:
    - cron: '0 0 * * 1' # Mondays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      # The script has no dependencies, so there is no install step.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: node scripts/fetch-projects.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: commit
        run: |
          if git diff --quiet -- public/data/projects.json; then
            echo "projects.json unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/projects.json
          git commit -m "chore(projects): update projects.json"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
